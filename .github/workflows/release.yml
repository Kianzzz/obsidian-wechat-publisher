name: 发布 Obsidian 插件

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建插件
        run: npm run build
      - name: 检查标签与插件版本一致
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./manifest.json').version")"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
