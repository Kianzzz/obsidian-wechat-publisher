name: 问题报告
description: 报告一个可以复现的 WeChatPB 问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交 AppSecret、访问令牌、代理密码或未发布的文章内容。
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: 请填写 Obsidian 版本、WeChatPB 版本和操作系统
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或脱敏日志
