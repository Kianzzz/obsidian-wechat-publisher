name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never post AppSecret, access tokens, proxy passwords, or private article content.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Obsidian version, WeChat Publisher version, and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or sanitized logs
